<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#031715">
<title>JACK.SYS</title>
<style>
  :root{
    --bg0:#020D0C; --bg1:#06231F; --panel:#052A26; --panel2:#03201C;
    --neon:#2BF5C8; --neon-dim:rgba(43,245,200,.42); --neon-faint:rgba(43,245,200,.14);
    --mint:#9FFFE0; --text:#D7EAE6; --muted:#7FA69E; --amber:#FFB454; --amber-dim:rgba(255,180,84,.35);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--text); font-size:16.5px; line-height:1.6;
    background:
      linear-gradient(rgba(43,245,200,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,245,200,.045) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg0) 70%);
    background-size:30px 30px, 30px 30px, 100% 100%;
    background-attachment:fixed;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 4px);
  }
  .app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 16px calc(16px + env(safe-area-inset-bottom));}

  .hud{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 2px 10px; font-family:var(--mono); font-size:11.5px; color:var(--muted);
    border-bottom:1px solid var(--neon-faint);
  }
  .hud .sys{color:var(--neon); letter-spacing:2px; text-shadow:0 0 8px var(--neon-dim); white-space:nowrap;}
  .hud .prog{letter-spacing:1px; white-space:nowrap;}
  .lang{display:flex; border:1px solid var(--neon-dim); clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
  .lang button{
    font-family:var(--mono); font-size:11px; letter-spacing:1px; padding:5px 11px;
    background:transparent; color:var(--muted); border:none; cursor:pointer;
  }
  .lang button.on{background:var(--neon); color:#04201C; font-weight:700;}
  .pbar{height:2px; background:var(--neon-faint);}
  .pbar i{display:block; height:100%; background:var(--neon); box-shadow:0 0 8px var(--neon-dim); transition:width .35s ease; width:0;}

  .stage{flex:1; display:flex; flex-direction:column; padding-top:16px;}
  .scene-title{
    font-family:var(--mono); font-size:12px; letter-spacing:3px; color:var(--amber);
    text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    font-size:25px; font-weight:800; line-height:1.35; color:#fff; letter-spacing:.3px;
    text-shadow:0 0 14px var(--neon-dim); margin-bottom:14px;
  }

  .jack{
    display:flex; gap:12px; align-items:flex-start; margin-bottom:16px;
    border:1px solid var(--neon-dim); background:linear-gradient(180deg, rgba(43,245,200,.07), rgba(43,245,200,.02));
    padding:13px; cursor:pointer;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .jack svg{flex:0 0 46px; height:46px; filter:drop-shadow(0 0 6px var(--neon-dim));}
  .jack .who{font-family:var(--mono); font-size:10.5px; letter-spacing:2px; color:var(--neon); margin-bottom:3px;}
  .jack .say{font-size:15.5px; color:var(--mint); min-height:24px;}
  .jack .cur{display:inline-block; width:8px; height:15px; background:var(--neon); vertical-align:-2px; margin-left:2px; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .jack .hint{font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:5px; letter-spacing:1px;}

  .panel{
    border:1px solid var(--neon-faint); background:linear-gradient(180deg, var(--panel), var(--panel2));
    padding:15px; margin-top:12px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .panel h3{font-size:16px; color:var(--neon); margin-bottom:6px; letter-spacing:.5px;}
  .panel p{font-size:15px;}
  .tagline{font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--amber); margin-bottom:6px;}
  .muted{color:var(--muted); font-size:13.5px; margin-top:10px;}
  .kv{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .kv span{
    font-family:var(--mono); font-size:12px; color:var(--neon);
    border:1px solid var(--neon-dim); padding:6px 11px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .steps{counter-reset:st;}
  .steps .st{display:flex; gap:12px; margin-top:11px; align-items:center;}
  .steps .st::before{
    counter-increment:st; content:'0' counter(st);
    font-family:var(--mono); color:var(--neon); border:1px solid var(--neon-dim);
    padding:5px 8px; font-size:13px; line-height:1;
    text-shadow:0 0 8px var(--neon-dim);
  }
  .steps .st b{color:#fff;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;}
  .cell{border:1px solid var(--neon-faint); background:rgba(43,245,200,.04); padding:11px 12px; font-size:13.5px;}
  .cell .code{font-family:var(--mono); font-size:10.5px; letter-spacing:2px; color:var(--amber);}
  .cell b{display:block; color:#fff; margin:3px 0 2px; font-size:14px;}

  .recipes{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px;}
  .recipe{border:1px solid var(--neon-faint); background:rgba(43,245,200,.05); padding:10px 11px; font-size:13.5px;}
  .recipe b{color:var(--neon); font-family:var(--mono); font-size:12px; letter-spacing:1px;}
  .recipe .res{margin-top:5px; font-weight:800; color:#fff;}
  .recipe.target{grid-column:1/-1; border-color:var(--amber-dim); background:rgba(255,180,84,.06);}
  .recipe.target b, .recipe.target .res{color:var(--amber);}
  input[type=range]{width:100%; margin:16px 0 4px; accent-color:var(--neon); height:34px;}
  .sliderval{text-align:center; font-family:var(--mono); font-size:26px; font-weight:700; color:var(--neon); text-shadow:0 0 10px var(--neon-dim);}
  .result{display:none; margin-top:13px; border:1px solid var(--neon-dim); background:rgba(43,245,200,.07); padding:13px; font-size:14.5px;}
  .result.show{display:block;}
  .result b{color:var(--neon);}

  .paths{margin-top:4px;}
  .paths button{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--neon-dim); background:rgba(43,245,200,.05); color:var(--text);
    font-family:var(--sans); font-size:16px; font-weight:700; padding:15px 14px; margin-top:11px; cursor:pointer;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:background .15s;
  }
  .paths button:active{background:rgba(43,245,200,.16);}
  .paths .code{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; color:var(--amber); border:1px solid var(--amber-dim); padding:5px 8px; flex-shrink:0;}
  .paths small{display:block; font-weight:400; font-size:13px; color:var(--muted);}

  .qz{margin-top:14px;}
  .qz .q{font-weight:700; color:#fff; font-size:15px; margin-bottom:4px;}
  .opt{
    display:block; width:100%; text-align:left; border:1px solid var(--neon-faint);
    background:rgba(43,245,200,.04); color:var(--text); font-family:var(--sans);
    font-size:14.5px; padding:11px 12px; margin-top:8px; cursor:pointer;
  }
  .opt.correct{border-color:var(--neon); background:rgba(43,245,200,.16); color:#fff; font-weight:700;}
  .opt.wrong{border-color:var(--amber); background:rgba(255,180,84,.10);}
  .opt:disabled{opacity:.95;}
  .fb{display:none; margin-top:7px; font-family:var(--mono); font-size:12.5px; letter-spacing:.5px;}
  .fb.show{display:block;}
  .fb.ok{color:var(--neon);}
  .fb.no{color:var(--amber);}
  .switch{background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:11.5px; letter-spacing:1.5px; margin:14px auto 0; display:block; cursor:pointer; text-decoration:underline;}

  .btn{
    display:block; width:100%; border:1px solid var(--neon); background:rgba(43,245,200,.10);
    color:var(--neon); font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:2px;
    padding:13px; margin-top:14px; cursor:pointer; text-transform:uppercase;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    text-shadow:0 0 8px var(--neon-dim); transition:background .15s;
  }
  .btn:active{background:rgba(43,245,200,.22); transform:scale(.985);}
  .nav{display:flex; gap:10px; margin-top:auto; padding-top:20px;}
  .nav .btn{margin-top:0;}
  .nav .back{flex:0 0 32%; color:var(--muted); border-color:var(--neon-faint); background:transparent; text-shadow:none;}
  .nav .next{flex:1;}

  .gate{flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding-bottom:30px;}
  .gate .boot{font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--muted); margin-bottom:18px;}
  .gate .boot .ok{color:var(--neon);}
  .gate h1{font-size:27px; line-height:1.45;}
  .gate .th-line{font-size:17px; color:var(--mint); margin-top:14px;}
  .gate .sub{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; color:var(--muted); margin-top:20px;}
  .flicker{animation:flick 4s linear infinite;}
  @keyframes flick{0%,93%,97%,100%{opacity:1} 94%,96%{opacity:.55}}

  .mindset{
    border:1px solid var(--neon-dim); padding:18px 16px; margin-top:12px; text-align:center;
    background:linear-gradient(180deg, rgba(43,245,200,.08), rgba(43,245,200,.02));
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .mindset p{font-size:17px; font-weight:700; color:#fff; line-height:1.7;}
  .qrbox{
    width:172px; height:172px; margin:18px auto 8px; background:#fff;
    display:flex; align-items:center; justify-content:center; padding:9px;
    border:1px solid var(--neon-dim);
  }
  .qrbox img{display:block; width:100%; height:100%;}
  footer{margin-top:22px; text-align:center; font-size:12px; color:var(--muted); line-height:1.8;}
  footer b{color:var(--mint);}
  .restart{background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:11.5px; letter-spacing:2px; margin:16px auto 0; display:block; cursor:pointer; text-decoration:underline;}

  @media (prefers-reduced-motion:reduce){ .flicker,.jack .cur{animation:none;} }
</style>
</head>

/* ---------- engine ---------- */
function render(){
  var s = SCENES[SCENE];
  var app = document.getElementById('app');
  var total = SCENES.length;
  var h = '';

  h += '<div class="hud"><span class="sys">JACK.SYS</span>' +
       '<span class="prog">' + L(UI.scene) + ' ' + pad(SCENE) + ' / ' + pad(total - 1) + '</span>' +
       '<span class="lang">' +
       '<button class="' + (LANG==='th'?'on':'') + '" onclick="setLang(\'th\')">TH</button>' +
       '<button class="' + (LANG==='en'?'on':'') + '" onclick="setLang(\'en\')">EN</button>' +
       '</span></div>' +
       '<div class="pbar"><i style="width:' + (SCENE/(total-1)*100) + '%"></i></div>';

  if (s.gate){
    h += '<div class="stage">' + s.render() + '</div>';
    app.innerHTML = h;
    return;
  }

  var title = (typeof s.title === 'function') ? s.title() : s.title;
  var jackLine = (typeof s.jack === 'function') ? s.jack() : s.jack;

  h += '<div class="stage">';
  h += '<div class="scene-title">// ' + s.code + '</div>';
  h += '<h1>' + L(title) + '</h1>';
  h += '<div class="jack" onclick="skipType()">' + JACK_SVG +
       '<div><div class="who">' + L(UI.who) + '</div>' +
       '<div class="say"><span id="jtxt"></span><span class="cur" id="jcur"></span></div>' +
       (s.showHint ? '<div class="hint">' + L(UI.hint) + '</div>' : '') +
       '</div></div>';
  h += s.body();
  h += '<div class="nav">' +
       '<button class="btn back" onclick="go(' + (SCENE-1) + ')">' + L(UI.back) + '</button>' +
       (s.noNext ? '' :
        (s.last
          ? '<button class="btn next" onclick="go(0)">' + L(UI.finish) + '</button>'
          : '<button class="btn next" onclick="go(' + (SCENE+1) + ')">' + L(UI.next) + '</button>')) +
       '</div>';
  h += '</div>';
  app.innerHTML = h;
  startType(L(jackLine));
  window.scrollTo(0, 0);
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function go(n){ stopType(); SCENE = Math.max(0, Math.min(SCENES.length - 1, n)); render(); }
function setLang(l){ if (LANG === l) return; LANG = l; document.documentElement.lang = l; render(); }
function pickPath(k){ BRANCH = k; go(7); }

function startType(text){
  stopType();
  var el = document.getElementById('jtxt');
  if (!el){ return; }
  typer = { t:null, full:text, i:0, el:el, done:false };
  typer.t = setInterval(function(){
    typer.i += 2;
    typer.el.textContent = typer.full.slice(0, typer.i);
    if (typer.i >= typer.full.length){ finishType(); }
  }, 16);
}
function skipType(){ if (!typer.done){ finishType(); } }
function finishType(){
  if (typer.t){ clearInterval(typer.t); typer.t = null; }
  if (typer.el){ typer.el.textContent = typer.full; }
  typer.done = true;
  var c = document.getElementById('jcur');
  if (c){ c.style.display = 'none'; }
}
function stopType(){ if (typer.t){ clearInterval(typer.t); typer.t = null; } typer.done = true; }

function revealGuess(){
  var g = parseInt(document.getElementById('guess').value, 10);
  var truth = 150;
  var d = Math.abs(g - truth);
  var t = LANG === 'th';
  var head = d <= 10 ? (t?'แม่นมาก!':'EXCELLENT!') : d <= 25 ? (t?'ใกล้เคียง!':'CLOSE!') : (t?'ไม่เป็นไรครับ':'GOOD TRY');
  var msg = '<b>' + head + '</b> ' + (t
    ? 'เฉลย <b>150 MPa</b> คุณห่าง ' + d
    : 'Answer: <b>150 MPa</b>. You were ' + d + ' off.') +
    '<br><br>' + (t
    ? 'คุณเพิ่งทำสิ่งเดียวกับ ML คือจับรูปแบบจากตัวอย่าง แต่ ML ดูทีเดียว 626 สูตร และไม่มีวันลืม'
    : 'You just did what ML does: spot the pattern. ML reads 626 recipes at once, and never forgets.');
  var box = document.getElementById('guessResult');
  box.innerHTML = msg;
  box.classList.add('show');
}

function answerQ(btn){
  var box = btn.parentElement;
  if (box.getAttribute('data-done') === '1'){ return; }
  box.setAttribute('data-done', '1');
  var correct = btn.getAttribute('data-c') === '1';
  var opts = box.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++){
    opts[i].disabled = true;
    if (opts[i].getAttribute('data-c') === '1'){ opts[i].classList.add('correct'); }
  }
  if (!correct){ btn.classList.add('wrong'); }
  var fb = box.querySelector('.fb');
  fb.textContent = correct ? L(UI.ok) : L(UI.no);
  fb.className = 'fb show ' + (correct ? 'ok' : 'no');
}

render();
</script>
